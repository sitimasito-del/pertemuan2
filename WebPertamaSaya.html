<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Website Pertama Saya</title>
    <link rel="stylesheet" href="style.css"> <!-- External CSS -->
    <style>
        /* Internal CSS */
        nav {
            background-color: #6d76ceb0;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        #content {
            float: left;
            width: 70%;
            height: 200px;
            border: 1px solid black;
        }

        #sidebar {
            float: right;
            width: 28%;
            height: 200px;
            border: 1px solid black;
        }

        footer {
            clear: both;
            text-align: center;
            border-top: 1px solid black;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h2 style="text-align: center;">WEBSITE PERTAMA SAYA</h2> <!-- Inline CSS -->
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Berita</a>
        <a href="#">Tentang Kami</a>
    </nav>

    <section>
        <img src="https://via.placeholder.com/800x200" alt="Gambar Pemandangan" width="100%">
    </section>

    <main>
        <div id="content">Content</div>
        <div id="sidebar">Sitebar</div>
    </main>

    <footer>
        <p>Copyright By Nama. Siti Masito Nim. 4124011</p>
    </footer>
</body>
</html>
