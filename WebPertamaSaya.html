<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Website Pertama Saya</title>
    <link rel="stylesheet" href="style.css"> <!-- External CSS -->
    <style>
        /* Internal CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f0ff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: white;
            padding: 10px;
        }

        nav {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: right; /* Menu rata kanan */
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        section img {
            width: 100%;
            height: auto;
        }

        #content {
            float: left;
            width: 70%;
            height: 200px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        #sidebar {
            float: right;
            width: 28%;
            height: 200px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        footer {
            clear: both;
            text-align: center;
            padding: 10px;
            border-top: 1px solid black;
        }
    </style>
</head>
<body>
    <header>
        <h2 style="text-align: center;">WEBSITE PERTAMA SAYA</h2> <!-- Inline CSS -->
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Berita</a>
        <a href="#">Tentang Kami</a>
    </nav>

    <!-- Gambar Alam -->
    <section>
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1350&q=80" alt="Gambar Gunung dan Laut">
    </section>

    <main>
        <div id="content">Content</div>
        <div id="sidebar">Sitebar</div>
    </main>

    <footer>
        <p>Copyright By Nama. Siti Masito Nim. 4124011</p>
    </footer>
</body>
</html>
